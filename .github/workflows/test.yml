name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install cryptography
      - run: python -m unittest discover -v
      - run: python examples/demo.py

  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/sigil-tla
          key: tla2tools-1.7.4-tlapm-1.6.0-pre
      # Runs the unbounded TLAPS safety proof (SigilProofs.tla) and the
      # bounded TLC models with their mutation tests; see docs/VERIFICATION.md.
      - run: formal/check.sh

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: cargo build --release --locked --manifest-path rust/Cargo.toml
      - run: cargo test --release --locked --manifest-path rust/Cargo.toml
      - name: Golden vectors still match the Python reference
        run: PYTHONPATH=. python rust/sigil-witness/tests/gen_vectors.py | cmp - rust/sigil-witness/tests/vectors.json
      - name: Interop (Python wallet against Rust witness processes)
        run: python bench/interop.py

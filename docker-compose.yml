# A 4-witness Sigil constellation, one container per witness.
#
#   docker compose up -d --build
#   docker compose run --rm --entrypoint cat init /net/directory.json > directory.json
#   docker compose kill -s SIGKILL witness2 && docker compose start witness2   # crash + restart
#   docker compose down        # keeps state; `down -v` wipes keys and stores
#
# `init` creates the keys, the genesis charter and directory.json once, in the
# shared `net` volume. Each witness keeps its durable store in its own volume.
# Witnesses are published on host loopback ports 7001-7004. This compose file
# is for local tests only: /net contains every witness private key, and the
# clients share one bridge address, so the witness rate limit is disabled.
# Do not expose these containers or reuse this topology for outside operators.
# See testnet/README.md and docs/OPERATOR_TESTNET.md.
#
# Each witness listens on 0.0.0.0 inside its container, which turns on the per-client
# rate limit by default (docs/WIRE.md "Admission control"). The ports are published on
# 127.0.0.1 only and every host client reaches a container from the bridge's one
# address, so this local testnet disables it with --rate-limit 0. Merely
# removing that flag and publishing the ports does not make this deployment
# suitable for an open network.

x-witness: &witness
  build: .
  image: sigil-witness
  depends_on:
    init:
      condition: service_completed_successfully
  entrypoint: ["sh", "-c"]
  restart: unless-stopped
  stop_signal: SIGTERM
  stop_grace_period: 10s

services:
  init:
    build: .
    image: sigil-witness
    entrypoint: ["sh", "/app/testnet/docker-init.sh"]
    environment:
      N: "4"
      NAME: orion
    volumes:
      - net:/net

  witness1:
    <<: *witness
    command: ["exec python -m sigil.witnessd run --key /net/keys/w1.json --registry /net/registry.json --constellation $$(cat /net/cid) --store /data/witness.db --host 0.0.0.0 --port 7000 --rate-limit 0"]
    ports: ["127.0.0.1:7001:7000"]
    volumes: ["net:/net:ro", "data1:/data"]

  witness2:
    <<: *witness
    command: ["exec python -m sigil.witnessd run --key /net/keys/w2.json --registry /net/registry.json --constellation $$(cat /net/cid) --store /data/witness.db --host 0.0.0.0 --port 7000 --rate-limit 0"]
    ports: ["127.0.0.1:7002:7000"]
    volumes: ["net:/net:ro", "data2:/data"]

  witness3:
    <<: *witness
    command: ["exec python -m sigil.witnessd run --key /net/keys/w3.json --registry /net/registry.json --constellation $$(cat /net/cid) --store /data/witness.db --host 0.0.0.0 --port 7000 --rate-limit 0"]
    ports: ["127.0.0.1:7003:7000"]
    volumes: ["net:/net:ro", "data3:/data"]

  witness4:
    <<: *witness
    command: ["exec python -m sigil.witnessd run --key /net/keys/w4.json --registry /net/registry.json --constellation $$(cat /net/cid) --store /data/witness.db --host 0.0.0.0 --port 7000 --rate-limit 0"]
    ports: ["127.0.0.1:7004:7000"]
    volumes: ["net:/net:ro", "data4:/data"]

volumes:
  net:
  data1:
  data2:
  data3:
  data4:

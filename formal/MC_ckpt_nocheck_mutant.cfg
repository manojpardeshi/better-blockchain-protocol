\* Mutation test of compaction (MC_ckpt.tla). Instance: sigil s; Ta = {(s,0)}, Tg = {(s,1)} (a consumed sigil and its re-spend).
\* Three versions: v0 = {h1,h2,h3,z} (q=3, z Byzantine with eager votes),
\* v1 = {h4} (q=1), v2 = {h5} (q=1), fresh keys; generations 0..1.
\* Mutation: members freeze without checking the checkpoint entries against their own
\* settled records: an adversarial driver checkpoints a sigil whose transition
\* is not complete (CkSound, the owners' liveness, is violated).
\* TLC must report a violation.
CONSTANTS
    Honest     = {h1, h2, h3, h4, h5}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {h4}
    M2         = {h5}
    Vers       <- CkVers
    Members    <- CkMembers
    Quorum     <- CkQuorum
    Sigils     <- SigilsS
    Tids       <- TidsDS
    Header     <- HdrDS
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
    FreezeOK <- FreezeNoCheck
SYMMETRY MCSymmetry
SPECIFICATION CSpec
INVARIANTS CkSound
CHECK_DEADLOCK FALSE

\* Mutation test: the implemented lone rule WITHOUT its own-vote condition
\* (LoneOK <- LoneNoOwn). h1 votes Tu at (s,1) in v0 and does not freeze;
\* the freezing quorum's evidence holds only Tb at (s,0), so h1 inherits Tb
\* although its own key voted above, releases it and votes Tg at (s,1):
\* a re-used honest key signs two tids for one (sigil, gen) (Bug 4).
\* TLC must report a violation.
CONSTANTS
    Honest     = {h1, h2, h3}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {h1}
    Vers       <- MCVers
    Members    <- MCMembers
    Quorum     <- MCQuorum
    Sigils     <- MCSigils
    Tids       <- TidsCex
    Header     <- HdrCex
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
    LoneOK     <- LoneNoOwn
SYMMETRY MCSymmetry
SPECIFICATION MCSpec
INVARIANTS Safety OneSealAcrossVersions HonestNoEquiv
CHECK_DEADLOCK FALSE

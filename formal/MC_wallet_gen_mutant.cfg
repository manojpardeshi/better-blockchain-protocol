\* BUG (current Wallet.authorise): a swap header written by the counter-party
\* names our sigil at another generation; authorise signs it and overwrites the
\* pending pledge. After the swap expires unbound, the wallet signs a second tid
\* at the first generation: self-equivocation. Must violate NoSelfEquiv.
CONSTANTS
    Honest = {h1, h2, h3}
    Byz    = {z}
    Q      = 3
    Tids   <- WTids
    MaxGen = 1
    TTL    = 2
    MAXT   = 5
    Swaps  <- WSwaps
    GenCheck         = FALSE
    RetainPending    = TRUE
    AbortNeedsQuorum = FALSE
    SaveOnAuthorise  = TRUE
    CrashOn          = TRUE
    IgnoreExpiry     = FALSE
    StatusAnswers    = 3
    AbortNoProof     = FALSE
SYMMETRY SymHonestW
SPECIFICATION Spec
INVARIANTS NoSelfEquiv
CHECK_DEADLOCK FALSE

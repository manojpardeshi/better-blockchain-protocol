\* Mutation test: the FIRST version of the sibling fix (AdoptMode =
\* "sibling_v1"), which inherits a lone live binding with no sibling at its own
\* generation even when the evidence reached a higher one. v0 seals Tu at
\* (s,1) and releases it (Ty kills Tu) while Tb stays bound at (s,0); ADOPT
\* inherits Tb at 0, a release moves it to 1 and v1 seals Tg there: a second
\* seal at (s,1). Found by the unbounded proof (formal/SigilRotProofs.tla);
\* tests/test_conformance.py RotationOpenBugTests reproduces it in the code.
\* TLC must report a violation; check.sh treats "no violation" as a failure.
CONSTANTS
    Honest0    = {a0, b0, c0}
    Honest1    = {a1, b1, c1}
    Z          = z
    Sigils     <- RotSigils
    Home       <- RotHome
    Tids       <- CexTids
    Header     <- CexHeader
    MaxGen     = 1
    AdoptMode  = "sibling_v1"
SYMMETRY SymHonest
SPECIFICATION Spec
INVARIANTS OneSealAcrossVersions
CHECK_DEADLOCK FALSE

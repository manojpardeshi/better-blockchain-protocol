\* Non-vacuity of the proved rotation spec (module MC_rotpw.tla, the
\* instance of MC_rotp.cfg): a contested record is settled by a seal for
\* its last candidate (W9, _sealed_candidate) with every condition of the
\* proved rule met. TLC must report NoContestedResolve VIOLATED.
CONSTANTS
    Honest     = {h1, h2, h3}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {h1}
    Vers       <- MCVers
    Members    <- MCMembers
    Quorum     <- MCQuorum
    Sigils     <- MCSigils
    Tids       <- TidsSib
    Header     <- HdrSib
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
SYMMETRY MCSymmetry
SPECIFICATION MCSpecW
INVARIANTS NoContestedResolve
CHECK_DEADLOCK FALSE

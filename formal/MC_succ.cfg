\* The succession spec the TLAPS proof is about (SigilSuccProofs.tla) on
\* instance B: v0 = {h1,h2,h3,z} (q=3, z Byzantine with eager votes) names
\* the committee K0 = {k1}; the succession version v1 = {k1} names no
\* committee. Sigils s, x: Ty = {(x,0)} kills Tb = {(s,0),(x,0)}, and
\* Tg = {(s,1)} is the recovery spend, so death proofs, releases before and
\* after the succession, and recovery at generation 1 are all exercised.
\* Inv and every proved property must hold on all reachable states.
CONSTANTS
    Honest     = {h1, h2, h3, k1}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {k1}
    K0         = {k1}
    K1         = {}
    Vers       <- MCVers
    Members    <- MCMembers
    Quorum     <- MCQuorum
    Committee  <- MCCommittee
    KQuorum    <- MCKQuorum
    Sigils     <- SigilsB
    Tids       <- TidsB
    Header     <- HdrB
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
SYMMETRY MCSymmetry
SPECIFICATION MCSpec
INVARIANTS Inv Safety OneSealAcrossVersions DeathProofsSound HonestNoEquiv
CHECK_DEADLOCK FALSE

\* The succession spec the TLAPS proof is about (SigilSuccProofs.tla) on
\* instance A: v0 = {h1,h2,h3,z} (q=3, z Byzantine with eager votes) names
\* the committee K0 = {k1}; the succession version v1 = {k1} (the committee
\* key takes over, q=1) names no committee. One sigil s; Ta and Tb both spend
\* it at generation 0 (the owner equivocates), Tg at generation 1. Old
\* members keep voting after the succession. Inv and every proved property
\* must hold on all reachable states.
CONSTANTS
    Honest     = {h1, h2, h3, k1}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {k1}
    K0         = {k1}
    K1         = {}
    Vers       <- MCVers
    Members    <- MCMembers
    Quorum     <- MCQuorum
    Committee  <- MCCommittee
    KQuorum    <- MCKQuorum
    Sigils     <- SigilsB
    Tids       <- TidsB
    Header     <- HdrB
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
SYMMETRY MCSymmetry
SPECIFICATION MCSpec
INVARIANTS Inv Safety OneSealAcrossVersions DeathProofsSound HonestNoEquiv
CHECK_DEADLOCK FALSE

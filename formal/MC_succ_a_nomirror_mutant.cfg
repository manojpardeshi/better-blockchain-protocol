\* Mutation test: witnesses of a version with a committee vote WITHOUT
\* mirror acks (MirQ <- MirAny), instance A. v0 seals Ta at (s,0) while the
\* committee k1 stored nothing; k1 fences and takes over as v1 with an empty
\* mirror, and seals Tb at (s,0): two seals for one (sigil, gen). TLC must
\* report a violation.
CONSTANTS
    Honest     = {h1, h2, h3, k1}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {k1}
    K0         = {k1}
    K1         = {}
    Vers       <- MCVers
    Members    <- MCMembers
    Quorum     <- MCQuorum
    Committee  <- MCCommittee
    KQuorum    <- MCKQuorum
    Sigils     <- SigilsA
    Tids       <- TidsA
    Header     <- HdrA
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
    MirQ       <- MirAny
SYMMETRY MCSymmetry
SPECIFICATION MCSpec
INVARIANTS Safety OneSealAcrossVersions HonestNoEquiv
CHECK_DEADLOCK FALSE

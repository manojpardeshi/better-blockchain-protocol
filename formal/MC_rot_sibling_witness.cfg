\* Non-vacuity of MC_rot_sibling4: TLC must find a run in which, after
\* rotation, the owner recovers s out of CONTESTED (or an unbound record)
\* and completes Tg at generation 1. check.sh treats "no violation" as failure.
CONSTANTS
    Honest0    = {a0, b0, c0}
    Honest1    = {a1, b1, c1}
    Z          = z
    Sigils     <- RotSigils
    Home       <- RotHome
    Tids       <- RotTids4
    Header     <- RotHeader4
    MaxGen     = 1
    AdoptMode  = "sibling"
SYMMETRY SymHonest
SPECIFICATION Spec
INVARIANTS TgNeverCompletes
CHECK_DEADLOCK FALSE

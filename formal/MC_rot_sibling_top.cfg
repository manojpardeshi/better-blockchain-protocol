\* The implemented rule (AdoptMode = "sibling": a lone live binding is
\* inherited only on top of the evidence) on the counterexample instance of
\* MC_rot_sibling_v1_mutant.cfg. Safety, cross-version Lemma 1 and honest
\* non-equivocation must all hold.
CONSTANTS
    Honest0    = {a0, b0, c0}
    Honest1    = {a1, b1, c1}
    Z          = z
    Sigils     <- RotSigils
    Home       <- RotHome
    Tids       <- CexTids
    Header     <- CexHeader
    MaxGen     = 1
    AdoptMode  = "sibling"
SYMMETRY SymHonest
SPECIFICATION Spec
INVARIANTS TypeOK Safety OneSealAcrossVersions HonestNoEquiv
CHECK_DEADLOCK FALSE

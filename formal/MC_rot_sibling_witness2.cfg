\* Non-vacuity of MC_rot_sibling4: TLC must find a run in which, after
\* rotation, a v1 witness releases a CONTESTED record (every live candidate
\* proven dead). check.sh treats "no violation" as a failure.
CONSTANTS
    Honest0    = {a0, b0, c0}
    Honest1    = {a1, b1, c1}
    Z          = z
    Sigils     <- RotSigils
    Home       <- RotHome
    Tids       <- RotTids4
    Header     <- RotHeader4
    MaxGen     = 1
    AdoptMode  = "sibling"
SYMMETRY SymHonest
SPECIFICATION Spec
INVARIANTS NoContestedRelease
CHECK_DEADLOCK FALSE

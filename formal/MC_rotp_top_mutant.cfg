\* Mutation test: W9 seal settlement WITHOUT `top <= g + 1`
\* (ResolveTop <- ResolveTopAny), with a FRESH key h4 as the only member of
\* v1 (no own votes, so ResolveOK holds). v0 seals Tb at (s,0) and Tu at
\* (s,1) and releases Tu while h3 stays bound to Tb; h4's record is
\* contested past Tu, and a seal for Tb settles it back to (s,0); after
\* Tb's release v1 seals Tg at (s,1): two seals at one (sigil, gen).
\* TLC must report a violation.
CONSTANTS
    Honest     = {h1, h2, h3, h4}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {h4}
    Vers       <- MCVers
    Members    <- MCMembers
    Quorum     <- MCQuorum
    Sigils     <- MCSigils
    Tids       <- TidsCex
    Header     <- HdrCex
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
    ResolveTop <- ResolveTopAny
SYMMETRY MCSymmetry
SPECIFICATION MCSpec
INVARIANTS Safety OneSealAcrossVersions HonestNoEquiv
CHECK_DEADLOCK FALSE

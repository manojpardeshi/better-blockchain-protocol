\* The wallet with the proposed FIXES (GenCheck, RetainPending, abort on a
\* death proof alone), CLI save discipline, crashes and restarts, a swap
\* counter-party and one Byzantine witness. Every wallet safety property holds.
CONSTANTS
    Honest = {h1, h2, h3}
    Byz    = {z}
    Q      = 3
    Tids   <- WTids
    MaxGen = 1
    TTL    = 2
    MAXT   = 5
    Swaps  <- WSwaps
    GenCheck         = TRUE
    RetainPending    = TRUE
    AbortNeedsQuorum = FALSE
    SaveOnAuthorise  = TRUE
    CrashOn          = TRUE
    IgnoreExpiry     = FALSE
    StatusAnswers    = 3
    AbortNoProof     = FALSE
SYMMETRY SymHonestW
SPECIFICATION Spec
INVARIANTS TypeOK NoSelfEquiv UnpledgeSound AbortSound OneComplete PaidIsComplete HeldIsTracked
CHECK_DEADLOCK FALSE

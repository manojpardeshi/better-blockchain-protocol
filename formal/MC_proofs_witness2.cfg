\* Reachability witness for MC_proofs.cfg: the instance must reach a state in
\* which an honest witness released a binding (TLC must report a violation of
\* NoRelease).
CONSTANTS
    Honest  = {h1, h2, h3}
    Byz     = {z1}
    Cons    <- MCCons
    Members <- MCMembers
    Quorum  <- MCQuorum
    Sigils  <- MCSigils
    Home    <- MCHome
    Tids    <- MCTids
    Header  <- MCHeader
    MaxGen  = 1
    NoTid   <- MCNoTid
    GenOf   <- MCGenOf
SYMMETRY SymHonest
SPECIFICATION MCSpec
INVARIANTS NoRelease
CHECK_DEADLOCK FALSE

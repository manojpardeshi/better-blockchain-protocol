\* Exhaustive over headers with three constellations: s1 homed at
\* C = {h1,h2,h3,z1} (q=3), s2 homed at D = {h4} (q=1), rogue R = {r1}.
\* Every assignment of valid headers to 3 transitions, generations 0..2,
\* eager Byzantine votes. Fixed (home-only) death-proof rule.
CONSTANTS
    HonestC     = {h1, h2, h3}
    ByzC        = {z1}
    HonestD     = {h4}
    ByzR        = {r1}
    Honest      <- MultiHonest
    Byz         <- MultiByz
    Cons        <- MultiCons
    Members     <- MultiMembers
    Quorum      <- QuorumNF
    Home        <- MultiHomeAll
    Sigils      <- MultiAllSigils
    Tids        = {t1, t2, t3}
    MaxGen      = 2
    HeaderSpace <- AllHeaders
    ByzEager    = TRUE
    AnyProof    = FALSE
    AnyConstellationProof = FALSE
SYMMETRY SymMultiAll
SPECIFICATION Spec
INVARIANTS TypeOK Safety HonestNoEquivocation OneSealPerGen DeathProofsSound
CHECK_DEADLOCK FALSE

\* Non-vacuity of the proved rotation spec (module MC_rotpw.tla, the
\* instance of MC_rotp.cfg): ADOPT makes a record contested and RELEASE
\* frees it once every candidate is proven dead (SPEC 5.2 step 2). TLC must
\* report NoContestedRelease VIOLATED.
CONSTANTS
    Honest     = {h1, h2, h3}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {h1}
    Vers       <- MCVers
    Members    <- MCMembers
    Quorum     <- MCQuorum
    Sigils     <- MCSigils
    Tids       <- TidsSib
    Header     <- HdrSib
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
SYMMETRY MCSymmetry
SPECIFICATION MCSpecW
INVARIANTS NoContestedRelease
CHECK_DEADLOCK FALSE

\* Three constellations (MC_multi.tla): C = {h1,h2,h3,z1} q=3 homes a and b;
\* D = {h4} q=1 homes c; R = {r1} is a rogue, all-Byzantine constellation
\* that can seal anything under its own id. The hand-picked transitions of
\* MC.cfg (t3 and t4 span C and D), generations 0..2, eager Byzantine votes.
\* Death proofs must come from the home of the sigil they name (fixed rule).
CONSTANTS
    HonestC     = {h1, h2, h3}
    ByzC        = {z1}
    HonestD     = {h4}
    ByzR        = {r1}
    Honest      <- MultiHonest
    Byz         <- MultiByz
    Cons        <- MultiCons
    Members     <- MultiMembers
    Quorum      <- QuorumNF
    Home        <- MultiHomeFixed
    Sigils      <- FixedSigils
    Tids        <- FixedTids
    MaxGen      = 2
    HeaderSpace <- FixedHeaders
    ByzEager    = TRUE
    AnyProof    = FALSE
    AnyConstellationProof = FALSE
SYMMETRY SymHonestC
SPECIFICATION Spec
INVARIANTS TypeOK Safety HonestNoEquivocation OneSealPerGen DeathProofsSound
CHECK_DEADLOCK FALSE

\* Mutation test: a succession that needs no quorum of the committee
\* (AdoptS <- AdoptSNoQuorum: here the empty set of standby members signs),
\* instance A. v1 adopts with no evidence and seals Tb at (s,0) next to
\* v0's seal of Ta. TLC must report a violation.
CONSTANTS
    Honest     = {h1, h2, h3, k1}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {k1}
    K0         = {k1}
    K1         = {}
    Vers       <- MCVers
    Members    <- MCMembers
    Quorum     <- MCQuorum
    Committee  <- MCCommittee
    KQuorum    <- MCKQuorum
    Sigils     <- SigilsA
    Tids       <- TidsA
    Header     <- HdrA
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
    AdoptS     <- AdoptSNoQuorum
SYMMETRY MCSymmetry
SPECIFICATION MCSpec
INVARIANTS Safety OneSealAcrossVersions HonestNoEquiv
CHECK_DEADLOCK FALSE

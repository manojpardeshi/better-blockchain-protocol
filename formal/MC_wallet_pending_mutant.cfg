\* BUG (current Wallet.transact / cli cmd_pay): after SealFailed the header and
\* body are forgotten (and never persisted). A delayed request completes the
\* transition later: the wallet still shows the parcel and can never finalise
\* it. Must violate HeldIsTracked.
CONSTANTS
    Honest = {h1, h2, h3}
    Byz    = {z}
    Q      = 3
    Tids   <- WTids
    MaxGen = 1
    TTL    = 2
    MAXT   = 5
    Swaps  <- NoSwaps
    GenCheck         = TRUE
    RetainPending    = FALSE
    AbortNeedsQuorum = FALSE
    SaveOnAuthorise  = TRUE
    CrashOn          = TRUE
    IgnoreExpiry     = FALSE
    StatusAnswers    = 3
    AbortNoProof     = FALSE
SYMMETRY SymHonestW
SPECIFICATION Spec
INVARIANTS HeldIsTracked
CHECK_DEADLOCK FALSE

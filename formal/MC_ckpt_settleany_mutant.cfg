\* Mutation test of compaction (MC_ckpt.tla).
\* Three versions: v0 = {h1,h2,h3,z} (q=3, z Byzantine with eager votes),
\* v1 = {h4} (q=1), v2 = {h5} (q=1), fresh keys; generations 0..1.
\* Mutation: the first SETTLE (review finding 1): a certificate forged by retired keys,
\* for any transition naming s, is accepted and overwrites the record; STATUS then
\* reports a binding that is not complete.
\* TLC must report a violation.
CONSTANTS
    Honest     = {h1, h2, h3, h4, h5}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {h4}
    M2         = {h5}
    Vers       <- CkVers
    Members    <- CkMembers
    Quorum     <- CkQuorum
    Sigils     <- SigilsS
    Tids       <- TidsDS
    Header     <- HdrDS
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
    SettleRule <- SettleAny
SYMMETRY MCSymmetry
SPECIFICATION CSpec
INVARIANTS StatusSound
CHECK_DEADLOCK FALSE

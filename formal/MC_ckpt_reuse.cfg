\* MC_ckpt.cfg with a RE-USED key: h1 is a member of v0, v1 and v2 (it adopts
\* each version with its own earlier votes); v0 = {h1,h2,h3,z}. Every invariant
\* must hold.
CONSTANTS
    Honest     = {h1, h2, h3}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {h1}
    M2         = {h1}
    Vers       <- CkVers
    Members    <- CkMembers
    Quorum     <- CkQuorum
    Sigils     <- SigilsS
    Tids       <- TidsDS
    Header     <- HdrDS
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
SYMMETRY MCSymmetry
SPECIFICATION CSpec
INVARIANTS Safety OneSealAcrossVersions DeathProofsSound HonestNoEquiv CkSound StatusSound SettledHeld
CHECK_DEADLOCK FALSE

\* Mutation test: MC.cfg with Release accepting ANY proof. TLC must report a
\* Safety violation; check.sh treats "no violation" as a failure.
CONSTANTS
    Honest      = {h1, h2, h3}
    Byz         = {z1}
    Quorum      = 3
    Sigils      <- FixedSigils
    Tids        <- FixedTids
    MaxGen      = 2
    HeaderSpace <- FixedHeaders
    ByzEager    = TRUE
    AnyProof    = TRUE
SYMMETRY SymHonest
SPECIFICATION Spec
INVARIANTS Safety
CHECK_DEADLOCK FALSE

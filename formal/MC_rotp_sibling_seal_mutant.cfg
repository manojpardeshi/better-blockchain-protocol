\* Mutation test (opt-in, slower): the FIRST sibling rule as in
\* MC_rotp_sibling_mutant.cfg, but checking only the double spend (Bug 3):
\* v0 seals Tu at (s,1) and releases it (Ty kills it) while Tb stays bound at
\* (s,0); ADOPT inherits Tb at 0, its release moves s to 1 and v1 seals
\* Tg = {(s,1)}: two seals at (s,1). TLC must report a violation of
\* OneSealAcrossVersions or Safety.
CONSTANTS
    Honest     = {h1, h2, h3}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {h1}
    Vers       <- MCVers
    Members    <- MCMembers
    Quorum     <- MCQuorum
    Sigils     <- MCSigils
    Tids       <- TidsCex
    Header     <- HdrCex
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
    LoneOK     <- LoneSibling
SYMMETRY MCSymmetry
SPECIFICATION MCSpec
INVARIANTS Safety OneSealAcrossVersions
CHECK_DEADLOCK FALSE

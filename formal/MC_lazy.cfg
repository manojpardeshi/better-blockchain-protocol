\* Cross-check of the ByzEager abstraction: Byzantine votes are added one at
\* a time by the explicit ByzVote action, on a smaller instance than MC_all.cfg (2 transitions).
CONSTANTS
    Honest      = {h1, h2, h3}
    Byz         = {z1}
    Quorum      = 3
    Sigils      = {s1, s2}
    Tids        = {t1, t2}
    MaxGen      = 1
    HeaderSpace <- AllHeaders
    ByzEager    = FALSE
    AnyProof    = FALSE
SYMMETRY SymAll
SPECIFICATION Spec
INVARIANTS TypeOK Safety HonestNoEquivocation OneSealPerGen DeathProofsSound
CHECK_DEADLOCK FALSE

\* Rotation with the PROPOSED FIX (AdoptMode = "sealaware"): ADOPT keys off
\* the v0 SEALS, not the raw bindings, so an unsealed sibling can never be
\* resurrected into a second seal and a sealed-then-dead generation is closed.
\* Two versions of home C (each n=4, q=3), sigils s and x, 4 transitions,
\* generations 0..1, eager Byzantine votes. Safety, cross-version Lemma 1 and
\* honest non-equivocation must all hold.
CONSTANTS
    Honest0    = {a0, b0, c0}
    Honest1    = {a1, b1, c1}
    Z          = z
    Sigils     <- RotSigils
    Home       <- RotHome
    Tids       <- RotTids
    Header     <- RotHeader
    MaxGen     = 1
    AdoptMode  = "sealaware"
SYMMETRY SymHonest
SPECIFICATION Spec
INVARIANTS TypeOK Safety OneSealAcrossVersions HonestNoEquiv
CHECK_DEADLOCK FALSE

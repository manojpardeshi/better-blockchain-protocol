\* Non-vacuity cross-check of the TLAPS proof (see MC_proofs.tla): the proof
\* module's own spec on N = 4 (3 honest + 1 Byzantine), q = 3, 2 sigils,
\* 3 transitions, generations 0..1, lazy Byzantine votes. TLC evaluates every
\* named ASSUME of SigilProofs.tla and checks the proved invariant.
CONSTANTS
    Honest  = {h1, h2, h3}
    Byz     = {z1}
    Cons    <- MCCons
    Members <- MCMembers
    Quorum  <- MCQuorum
    Sigils  <- MCSigils
    Home    <- MCHome
    Tids    <- MCTids
    Header  <- MCHeader
    MaxGen  = 1
    NoTid   <- MCNoTid
    GenOf   <- MCGenOf
SYMMETRY SymHonest
SPECIFICATION MCSpec
INVARIANTS InvB Safety OneSealPerGenB DeathProofsSound
CHECK_DEADLOCK FALSE

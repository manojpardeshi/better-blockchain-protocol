\* Mutation test for SigilDeep.tla: the threshold is only f = 1 instead of
\* f+1 = 2. Then a single faulty current member can "confirm" a forged binding.
\* TLC must report a DeepSound violation; check.sh treats "no violation" as a
\* failure.
CONSTANTS
    Honest    = {h1, h2, h3}
    Faulty    = {z1}
    Gens      = {0, 1}
    Tids      = {t1, t2}
    TrueGen   = 0
    TrueTid   = t1
    Threshold = 1
SPECIFICATION Spec
INVARIANTS TypeOK DeepSound
CHECK_DEADLOCK FALSE

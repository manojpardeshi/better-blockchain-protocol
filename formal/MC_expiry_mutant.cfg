\* Mutation test for SigilExpiry.tla: honest witnesses ignore the expiry
\* guard (IgnoreExpiry = TRUE). TLC must find a run where the wallet drops the
\* pledge and an honest witness then binds the tid (WalletClaim violated).
\* check.sh treats "no violation" as a failure.
CONSTANTS
    Honest       = {h1, h2, h3}
    Byz          = {z1}
    Quorum       = 3
    EXPIRES      = 3
    SKEW         = 1
    MAXSKEW      = 2
    MAXTIME      = 7
    IgnoreExpiry = TRUE
SPECIFICATION Spec
INVARIANTS WalletClaim
CHECK_DEADLOCK FALSE

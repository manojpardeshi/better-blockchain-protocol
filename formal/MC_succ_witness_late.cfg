\* Non-vacuity of the proved succession spec (module MC_succw.tla, instance
\* A of MC_succ_a.cfg): an honest old member casts a new vote after a standby member signed a successor (the old quorum comes back), on a binding mirrored before the fence. TLC must report NoLateOldVote VIOLATED.
CONSTANTS
    Honest     = {h1, h2, h3, k1}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {k1}
    K0         = {k1}
    K1         = {}
    Vers       <- MCVers
    Members    <- MCMembers
    Quorum     <- MCQuorum
    Committee  <- MCCommittee
    KQuorum    <- MCKQuorum
    Sigils     <- SigilsA
    Tids       <- TidsA
    Header     <- HdrA
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
SYMMETRY MCSymmetry
SPECIFICATION MCSpecW
INVARIANTS NoLateOldVote
CHECK_DEADLOCK FALSE

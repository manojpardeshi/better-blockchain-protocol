\* Non-vacuity of the proved succession spec (module MC_succw.tla, instance
\* B of MC_succ.cfg): v0 seals Tb at (s,0), Ty consumes x so Tb is dead, the
\* committee takes over (no member of v0 froze), and the successor releases
\* s and seals the owner's recovery spend Tg at (s,1). TLC must report
\* NoRecoveryAfterSuccession VIOLATED.
CONSTANTS
    Honest     = {h1, h2, h3, k1}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {k1}
    K0         = {k1}
    K1         = {}
    Vers       <- MCVers
    Members    <- MCMembers
    Quorum     <- MCQuorum
    Committee  <- MCCommittee
    KQuorum    <- MCKQuorum
    Sigils     <- SigilsB
    Tids       <- TidsB
    Header     <- HdrB
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
SYMMETRY MCSymmetry
SPECIFICATION MCSpecW
INVARIANTS NoRecoveryAfterSuccession
CHECK_DEADLOCK FALSE

\* Compaction (SPEC 5.7) on the proved rotation spec (MC_ckpt.tla).
\* Three versions: v0 = {h1,h2,h3,z} (q=3, z Byzantine with eager votes),
\* v1 = {h4} (q=1), v2 = {h5} (q=1), fresh keys; generations 0..1.
\* Instance: sigils s, x; Tb = {(s,0),(x,0)}, Ta = {(s,0)}, Ty = {(x,0)}, Tg = {(s,1)}.
\* Honest members settle on completion certificates, the adversarial driver
\* picks any checkpoint set for each charter, honest members freeze only under
\* the SPEC 5.7 rules and omit checkpointed sigils, adopters record checkpoint
\* entries as settled. Safety, cross-version Lemma 1, sound death proofs,
\* honest non-equivocation and CkSound must all hold.
\* Larger; opt-in via SIGIL_TLC_EXTRA.
CONSTANTS
    Honest     = {h1, h2, h3, h4, h5}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {h4}
    M2         = {h5}
    Vers       <- CkVers
    Members    <- CkMembers
    Quorum     <- CkQuorum
    Sigils     <- MCSigils
    Tids       <- TidsSib
    Header     <- HdrSib
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
SYMMETRY MCSymmetry
SPECIFICATION CSpec
INVARIANTS Safety OneSealAcrossVersions DeathProofsSound HonestNoEquiv CkSound
CHECK_DEADLOCK FALSE

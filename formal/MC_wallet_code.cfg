\* The CURRENT code (sigil/wallet.py + cli.py cmd_pay save points): payments
\* only (the CLI has no swaps), headers dropped after SealFailed, abort needs a
\* quorum of releases, crashes and restarts. The SAFETY properties (a) no
\* self-equivocation, (b) dropped pledges never seal, (d) no double
\* consumption, (c) reported payments are complete, all hold.
CONSTANTS
    Honest = {h1, h2, h3}
    Byz    = {z}
    Q      = 3
    Tids   <- WTids
    MaxGen = 1
    TTL    = 2
    MAXT   = 5
    Swaps  <- NoSwaps
    GenCheck         = FALSE
    RetainPending    = FALSE
    AbortNeedsQuorum = TRUE
    SaveOnAuthorise  = TRUE
    CrashOn          = TRUE
    IgnoreExpiry     = FALSE
    StatusAnswers    = 3
    AbortNoProof     = FALSE
SYMMETRY SymHonestW
SPECIFICATION Spec
INVARIANTS TypeOK NoSelfEquiv UnpledgeSound AbortSound OneComplete PaidIsComplete
CHECK_DEADLOCK FALSE

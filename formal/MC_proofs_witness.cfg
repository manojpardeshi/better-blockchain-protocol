\* Reachability witness for MC_proofs.cfg: the instance must reach a state
\* where some transition is complete, and one where a binding was released.
\* check.sh expects TLC to report a violation of NoCompletion (it stops at the
\* first violated invariant, so NoRelease is probed by MC_proofs_witness2.cfg).
CONSTANTS
    Honest  = {h1, h2, h3}
    Byz     = {z1}
    Cons    <- MCCons
    Members <- MCMembers
    Quorum  <- MCQuorum
    Sigils  <- MCSigils
    Home    <- MCHome
    Tids    <- MCTids
    Header  <- MCHeader
    MaxGen  = 1
    NoTid   <- MCNoTid
    GenOf   <- MCGenOf
SYMMETRY SymHonest
SPECIFICATION MCSpec
INVARIANTS NoCompletion
CHECK_DEADLOCK FALSE

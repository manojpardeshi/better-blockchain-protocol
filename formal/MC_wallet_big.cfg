\* The wallet with the proposed FIXES (GenCheck, RetainPending, abort on a
\* death proof alone), CLI save discipline, crashes and restarts, a swap
\* counter-party and one Byzantine witness. Every wallet safety property holds.
\* OPT-IN larger instance (about 5 min): four transitions, two of them swaps,
\* generations 0..2, time 0..6. Run with SIGIL_TLC_EXTRA=MC_wallet_big.cfg.
CONSTANTS
    Honest = {h1, h2, h3}
    Byz    = {z}
    Q      = 3
    Tids   <- WTids4
    MaxGen = 2
    TTL    = 2
    MAXT   = 6
    Swaps  <- WSwaps4
    GenCheck         = TRUE
    RetainPending    = TRUE
    AbortNeedsQuorum = FALSE
    SaveOnAuthorise  = TRUE
    CrashOn          = TRUE
    IgnoreExpiry     = FALSE
    StatusAnswers    = 3
    AbortNoProof     = FALSE
SYMMETRY SymHonestW
SPECIFICATION Spec
INVARIANTS TypeOK NoSelfEquiv UnpledgeSound AbortSound OneComplete PaidIsComplete HeldIsTracked
CHECK_DEADLOCK FALSE

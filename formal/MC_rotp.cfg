\* The rotation spec the TLAPS proof is about (SigilRotProofs.tla), with the
\* PROVED ADOPT rule (LoneOK / ResolveOK, = sigil/witness.py), on the Bug 1
\* scenario: v0 = {h1,h2,h3,z} (q=3), v1 = {h1} (q=1; h1 re-used), z
\* Byzantine with eager votes, sigils s, x, transitions Tb, Ta, Ty, Tg,
\* generations 0..1. Honest keys may stay unfrozen in v0, freeze, and adopt
\* v1 from any freezing quorum. The inductive invariant Inv and every proved
\* property must hold on all reachable states.
CONSTANTS
    Honest     = {h1, h2, h3}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {h1}
    Vers       <- MCVers
    Members    <- MCMembers
    Quorum     <- MCQuorum
    Sigils     <- MCSigils
    Tids       <- TidsSib
    Header     <- HdrSib
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
SYMMETRY MCSymmetry
SPECIFICATION MCSpec
INVARIANTS Inv Safety OneSealAcrossVersions DeathProofsSound HonestNoEquiv
CHECK_DEADLOCK FALSE

\* Mutation test: standby members keep storing after they signed a successor
\* (MirrorAck <- MirrorAckNoFence), instance A. k1 fences with an empty
\* mirror and adopts v1; the old quorum then gets its binding of Ta acked
\* and seals it at (s,0), while v1 (which never saw it) seals Tb there. TLC
\* must report a violation.
CONSTANTS
    Honest     = {h1, h2, h3, k1}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {k1}
    K0         = {k1}
    K1         = {}
    Vers       <- MCVers
    Members    <- MCMembers
    Quorum     <- MCQuorum
    Committee  <- MCCommittee
    KQuorum    <- MCKQuorum
    Sigils     <- SigilsA
    Tids       <- TidsA
    Header     <- HdrA
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
    MirrorAck  <- MirrorAckNoFence
SYMMETRY MCSymmetry
SPECIFICATION MCSpec
INVARIANTS Safety OneSealAcrossVersions HonestNoEquiv
CHECK_DEADLOCK FALSE

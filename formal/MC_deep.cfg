\* Deep-confirmation soundness (SigilDeep.tla): current charter n=4, f=1, so
\* the threshold is f+1 = 2. One honest minority (f=1) is faulty and may
\* report any (gen, tid). 2 generations, 2 tids. No forged (gen, tid) is ever
\* deep-confirmed -- only the true binding can be.
CONSTANTS
    Honest    = {h1, h2, h3}
    Faulty    = {z1}
    Gens      = {0, 1}
    Tids      = {t1, t2}
    TrueGen   = 0
    TrueTid   = t1
    Threshold = 2
SPECIFICATION Spec
INVARIANTS TypeOK DeepSound TrueConfirmable
CHECK_DEADLOCK FALSE

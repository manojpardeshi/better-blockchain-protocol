\* Mutation test for SigilExpiry.tla: the wallet's margin is too small
\* (MAXSKEW = 0 while a witness clock can lag the wallet's by 2*SKEW = 2).
\* TLC must find a run where the wallet drops the pledge while some witness
\* clock is still at or before the expiry, and that witness then binds the tid
\* from a delayed request (WalletClaim violated). This shows max_skew is
\* load-bearing: it must bound how far any witness clock can lag the wallet's.
CONSTANTS
    Honest       = {h1, h2, h3}
    Byz          = {z1}
    Quorum       = 3
    EXPIRES      = 3
    SKEW         = 1
    MAXSKEW      = 0
    MAXTIME      = 7
    IgnoreExpiry = FALSE
SPECIFICATION Spec
INVARIANTS WalletClaim
CHECK_DEADLOCK FALSE

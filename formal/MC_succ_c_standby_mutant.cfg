\* Mutation test: the committee of v1 enters standby WITHOUT the history v1
\* inherited by rotation (StandbyR <- StandbyRNoEvidence), instance C. v0 seals
\* Ta at (s,0) and freezes; h4 adopts it in v1; k1 enters standby with an empty
\* mirror, fences and takes over as v2, then seals Tb at (s,0). TLC must report
\* a violation.
CONSTANTS
    Honest     = {h1, h2, h3, h4, k1}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {h4}
    M2         = {k1}
    K0         = {}
    K1         = {k1}
    K2         = {}
    Vers       <- MCVers3
    Members    <- MCMembers3
    Quorum     <- MCQuorum3
    Committee  <- MCCommittee3
    KQuorum    <- MCKQuorum3
    Sigils     <- SigilsA
    Tids       <- TidsC
    Header     <- HdrC
    MaxGen     = 0
    Nat        <- G3
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf3
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals3
    StandbyR   <- StandbyRNoEvidence
SYMMETRY MCSymmetry3
SPECIFICATION MCSpec3
INVARIANTS Safety OneSealAcrossVersions HonestNoEquiv
CHECK_DEADLOCK FALSE

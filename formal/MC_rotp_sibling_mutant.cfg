\* Mutation test: the FIRST sibling rule (LoneOK <- LoneSibling: inherit a
\* lone live binding if nothing else is bound AT its generation) in the
\* proved rotation spec, on the Bugs 3/4 instance: Ty = {(x,0)} kills
\* Tb = {(s,0),(x,0)} and Tu = {(s,1),(x,0)}; v0 = {h1,h2,h3,z}, v1 = {h1}.
\* v0 seals Tu at (s,1) and releases it while Tb stays bound at (s,0); ADOPT
\* inherits Tb at 0, a release moves it to 1, and v1 votes Tg = {(s,1)}
\* there: a second seal at (s,1) and/or the re-used key h1 voting two tids
\* at (s,1). TLC must report a violation (check.sh treats "no violation" as
\* a failure).
CONSTANTS
    Honest     = {h1, h2, h3}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {h1}
    Vers       <- MCVers
    Members    <- MCMembers
    Quorum     <- MCQuorum
    Sigils     <- MCSigils
    Tids       <- TidsCex
    Header     <- HdrCex
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
    LoneOK     <- LoneSibling
SYMMETRY MCSymmetry
SPECIFICATION MCSpec
INVARIANTS Safety OneSealAcrossVersions HonestNoEquiv
CHECK_DEADLOCK FALSE

\* Non-vacuity of the proved rotation spec (module MC_rotpw.tla, the
\* instance of MC_rotp.cfg): version 0 seals Tb at (s,0), Ty kills it
\* through x, and after rotation version 1 seals the owner's recovery spend
\* Tg at (s,1). TLC must report NoRecoveryAfterRotation VIOLATED.
CONSTANTS
    Honest     = {h1, h2, h3}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {h1}
    Vers       <- MCVers
    Members    <- MCMembers
    Quorum     <- MCQuorum
    Sigils     <- MCSigils
    Tids       <- TidsSib
    Header     <- HdrSib
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
SYMMETRY MCSymmetry
SPECIFICATION MCSpecW
INVARIANTS NoRecoveryAfterRotation
CHECK_DEADLOCK FALSE

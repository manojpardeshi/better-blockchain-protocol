\* Exhaustive over headers: every assignment of valid headers to 3
\* transitions over 2 sigils, generations 0..2 (3375 header maps). Symmetric in witnesses,
\* sigils and transitions.
CONSTANTS
    Honest      = {h1, h2, h3}
    Byz         = {z1}
    Quorum      = 3
    Sigils      = {s1, s2}
    Tids        = {t1, t2, t3}
    MaxGen      = 2
    HeaderSpace <- AllHeaders
    ByzEager    = TRUE
    AnyProof    = FALSE
SYMMETRY SymAll
SPECIFICATION Spec
INVARIANTS TypeOK Safety HonestNoEquivocation OneSealPerGen DeathProofsSound
CHECK_DEADLOCK FALSE

\* Mutation: unpledge trusting the STATUS of only one honest member (e.g. a
\* directory listing one witness twice). Must violate UnpledgeSound.
CONSTANTS
    Honest = {h1, h2, h3}
    Byz    = {z}
    Q      = 3
    Tids   <- WTids
    MaxGen = 1
    TTL    = 2
    MAXT   = 5
    Swaps  <- WSwaps
    GenCheck         = TRUE
    RetainPending    = TRUE
    AbortNeedsQuorum = FALSE
    SaveOnAuthorise  = TRUE
    CrashOn          = TRUE
    IgnoreExpiry     = FALSE
    StatusAnswers    = 1
    AbortNoProof     = FALSE
SYMMETRY SymHonestW
SPECIFICATION Spec
INVARIANTS UnpledgeSound
CHECK_DEADLOCK FALSE

\* BUG (current Wallet.abort): the pledge is dropped only if a quorum of
\* witnesses RELEASED. If the input was bound at fewer, the dead pledge can never
\* be dropped (and unpledge is blocked by the vote history): the parcel is
\* frozen forever. Must violate RecoveryLive.
CONSTANTS
    Honest = {h1, h2, h3}
    Byz    = {z}
    Q      = 3
    Tids   <- WTids
    MaxGen = 1
    TTL    = 2
    MAXT   = 5
    Swaps  <- WSwaps
    GenCheck         = TRUE
    RetainPending    = TRUE
    AbortNeedsQuorum = TRUE
    SaveOnAuthorise  = TRUE
    CrashOn          = FALSE
    IgnoreExpiry     = FALSE
    StatusAnswers    = 3
    AbortNoProof     = FALSE
SPECIFICATION LiveSpec
PROPERTIES RecoveryLive
CHECK_DEADLOCK FALSE

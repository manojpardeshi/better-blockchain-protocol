\* Mutation test: the CURRENT ADOPT (AdoptMode = "real", SPEC 5.4 /
\* witness.py). When the owner equivocates at one generation and the SEALED
\* sibling dies while an UNSEALED sibling stays "alive", ADOPT re-binds the
\* unsealed sibling and v1 seals it -- a second seal at one (sigil, gen) and a
\* double spend. This is the bug found against the real Python code
\* (tests/test_conformance.py). TLC must report a violation; check.sh treats
\* "no violation" as a failure.
CONSTANTS
    Honest0    = {a0, b0, c0}
    Honest1    = {a1, b1, c1}
    Z          = z
    Sigils     <- RotSigils
    Home       <- RotHome
    Tids       <- RotTids
    Header     <- RotHeader
    MaxGen     = 1
    AdoptMode  = "real"
SYMMETRY SymHonest
SPECIFICATION Spec
INVARIANTS Safety OneSealAcrossVersions
CHECK_DEADLOCK FALSE

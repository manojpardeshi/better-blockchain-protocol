\* Non-vacuity: with the fixes, after an abort the wallet still completes a
\* payment (at the next generation). Must violate NoPaymentAfterAbort.
CONSTANTS
    Honest = {h1, h2, h3}
    Byz    = {z}
    Q      = 3
    Tids   <- WTids
    MaxGen = 1
    TTL    = 2
    MAXT   = 5
    Swaps  <- WSwaps
    GenCheck         = TRUE
    RetainPending    = TRUE
    AbortNeedsQuorum = FALSE
    SaveOnAuthorise  = TRUE
    CrashOn          = TRUE
    IgnoreExpiry     = FALSE
    StatusAnswers    = 3
    AbortNoProof     = FALSE
SYMMETRY SymHonestW
SPECIFICATION Spec
INVARIANTS NoPaymentAfterAbort
CHECK_DEADLOCK FALSE

\* Mutation test reproducing the rogue-constellation double spend:
\* MC_multi.cfg with AnyConstellationProof = TRUE, i.e. a death proof's seal
\* or votes may come from ANY constellation in the registry, not only from
\* the home of the sigil it names. TLC must report a Safety violation;
\* check.sh treats "no violation" as a failure.
CONSTANTS
    HonestC     = {h1, h2, h3}
    ByzC        = {z1}
    HonestD     = {h4}
    ByzR        = {r1}
    Honest      <- MultiHonest
    Byz         <- MultiByz
    Cons        <- MultiCons
    Members     <- MultiMembers
    Quorum      <- QuorumNF
    Home        <- MultiHomeFixed
    Sigils      <- FixedSigils
    Tids        <- FixedTids
    MaxGen      = 2
    HeaderSpace <- FixedHeaders
    ByzEager    = TRUE
    AnyProof    = FALSE
    AnyConstellationProof = TRUE
SYMMETRY SymHonestC
SPECIFICATION Spec
INVARIANTS Safety
CHECK_DEADLOCK FALSE

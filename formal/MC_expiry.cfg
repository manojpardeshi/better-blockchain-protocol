\* Owner-signed expiry and the wallet's unpledge rule (SigilExpiry.tla):
\* N = 4 (3 honest + 1 Byzantine), q = 3, expiry at 3, every clock within
\* SKEW = 1 of real time (so a witness can lag the wallet by up to 2), the
\* wallet margin MAXSKEW = 2, real time 0..7, arbitrarily delayed requests.
\* The witness guard and the wallet claim must hold.
CONSTANTS
    Honest       = {h1, h2, h3}
    Byz          = {z1}
    Quorum       = 3
    EXPIRES      = 3
    SKEW         = 1
    MAXSKEW      = 2
    MAXTIME      = 7
    IgnoreExpiry = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK SkewOK NoBindAfterExpiry WalletClaim
CHECK_DEADLOCK FALSE

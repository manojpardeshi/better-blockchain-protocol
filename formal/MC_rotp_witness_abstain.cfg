\* Non-vacuity of the proved rotation spec (module MC_rotpw.tla, the
\* instance of MC_rotp.cfg): the re-used key h1, which voted another tid at
\* the inherited generation, inherits a lone binding in abstention (SPEC
\* 5.4). TLC must report NoAbstain VIOLATED.
CONSTANTS
    Honest     = {h1, h2, h3}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {h1}
    Vers       <- MCVers
    Members    <- MCMembers
    Quorum     <- MCQuorum
    Sigils     <- MCSigils
    Tids       <- TidsSib
    Header     <- HdrSib
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
SYMMETRY MCSymmetry
SPECIFICATION MCSpecW
INVARIANTS NoAbstain
CHECK_DEADLOCK FALSE

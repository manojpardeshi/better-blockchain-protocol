\* Non-vacuity of MC_ckpt.cfg: a checkpointed record reaches version 2 (carried through two rotations).
\* TLC must report NoCheckpointAtV2 VIOLATED.
CONSTANTS
    Honest     = {h1, h2, h3, h4, h5}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {h4}
    M2         = {h5}
    Vers       <- CkVers
    Members    <- CkMembers
    Quorum     <- CkQuorum
    Sigils     <- SigilsS
    Tids       <- TidsDS
    Header     <- HdrDS
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
SYMMETRY MCSymmetry
SPECIFICATION CSpec
INVARIANTS NoCheckpointAtV2
CHECK_DEADLOCK FALSE

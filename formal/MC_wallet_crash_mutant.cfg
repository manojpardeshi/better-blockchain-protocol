\* BUG (library Wallet.pay / transact): the pledge cannot be saved between
\* authorise and the first spend request. A crash in that window restarts the
\* wallet without the pledge, and it signs a second tid at the same generation.
\* Must violate NoSelfEquiv.
CONSTANTS
    Honest = {h1, h2, h3}
    Byz    = {z}
    Q      = 3
    Tids   <- WTids
    MaxGen = 1
    TTL    = 2
    MAXT   = 5
    Swaps  <- NoSwaps
    GenCheck         = TRUE
    RetainPending    = TRUE
    AbortNeedsQuorum = FALSE
    SaveOnAuthorise  = FALSE
    CrashOn          = TRUE
    IgnoreExpiry     = FALSE
    StatusAnswers    = 3
    AbortNoProof     = FALSE
SYMMETRY SymHonestW
SPECIFICATION Spec
INVARIANTS NoSelfEquiv
CHECK_DEADLOCK FALSE

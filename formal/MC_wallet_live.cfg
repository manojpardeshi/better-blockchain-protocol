\* Recovery liveness for the FIXED wallet: a pledged transition that is
\* provably dead is eventually abandoned (WF on Abort). No crashes, no symmetry
\* (TLC liveness checking is unsound under symmetry).
CONSTANTS
    Honest = {h1, h2, h3}
    Byz    = {z}
    Q      = 3
    Tids   <- WTids
    MaxGen = 1
    TTL    = 2
    MAXT   = 5
    Swaps  <- WSwaps
    GenCheck         = TRUE
    RetainPending    = TRUE
    AbortNeedsQuorum = FALSE
    SaveOnAuthorise  = TRUE
    CrashOn          = FALSE
    IgnoreExpiry     = FALSE
    StatusAnswers    = 3
    AbortNoProof     = FALSE
SPECIFICATION LiveSpec
PROPERTIES RecoveryLive
CHECK_DEADLOCK FALSE

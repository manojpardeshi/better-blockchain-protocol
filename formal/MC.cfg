\* Main instance: N = 4 (3 honest + 1 Byzantine), q = 3, 3 sigils,
\* 4 hand-picked transitions, generations 0..2, eager Byzantine votes.
CONSTANTS
    Honest      = {h1, h2, h3}
    Byz         = {z1}
    Cons        <- OneCons
    Members     <- OneMembers
    Quorum      <- QuorumNF
    Home        <- AllHomeC
    Sigils      <- FixedSigils
    Tids        <- FixedTids
    MaxGen      = 2
    HeaderSpace <- FixedHeaders
    ByzEager    = TRUE
    AnyProof    = FALSE
    AnyConstellationProof = FALSE
SYMMETRY SymHonest
SPECIFICATION Spec
INVARIANTS TypeOK Safety HonestNoEquivocation OneSealPerGen DeathProofsSound
CHECK_DEADLOCK FALSE

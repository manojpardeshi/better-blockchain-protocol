\* Mutation: abort without a death proof. The abandoned transition completes
\* later. Must violate AbortSound.
CONSTANTS
    Honest = {h1, h2, h3}
    Byz    = {z}
    Q      = 3
    Tids   <- WTids
    MaxGen = 1
    TTL    = 2
    MAXT   = 5
    Swaps  <- WSwaps
    GenCheck         = TRUE
    RetainPending    = TRUE
    AbortNeedsQuorum = FALSE
    SaveOnAuthorise  = TRUE
    CrashOn          = TRUE
    IgnoreExpiry     = FALSE
    StatusAnswers    = 3
    AbortNoProof     = TRUE
SYMMETRY SymHonestW
SPECIFICATION Spec
INVARIANTS AbortSound
CHECK_DEADLOCK FALSE

\* The proved succession spec on instance C, three versions: v0 = {h1,h2,h3,z}
\* (no committee) is rotated into v1 = {h4}, whose charter names the committee
\* K1 = {k1}; v1 is succeeded by v2 = {k1}. The committee enters standby with
\* what v1 inherited from v0, so the succession keeps v0's seals. Inv and every
\* proved property must hold on all reachable states.
CONSTANTS
    Honest     = {h1, h2, h3, h4, k1}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {h4}
    M2         = {k1}
    K0         = {}
    K1         = {k1}
    K2         = {}
    Vers       <- MCVers3
    Members    <- MCMembers3
    Quorum     <- MCQuorum3
    Committee  <- MCCommittee3
    KQuorum    <- MCKQuorum3
    Sigils     <- SigilsA
    Tids       <- TidsC
    Header     <- HdrC
    MaxGen     = 0
    Nat        <- G3
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf3
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals3

SYMMETRY MCSymmetry3
SPECIFICATION MCSpec3
INVARIANTS Inv Safety OneSealAcrossVersions DeathProofsSound HonestNoEquiv
CHECK_DEADLOCK FALSE

\* Mutation test: W9 seal settlement WITHOUT its own-vote condition
\* (ResolveOK <- ResolveAny). A contested record of the re-used key h1 is
\* settled back to a sealed candidate below h1's own vote; once that
\* candidate is released h1 votes again at a generation where it already
\* voted another tid. TLC must report a violation.
CONSTANTS
    Honest     = {h1, h2, h3}
    Byz        = {z}
    M0         = {h1, h2, h3, z}
    M1         = {h1}
    Vers       <- MCVers
    Members    <- MCMembers
    Quorum     <- MCQuorum
    Sigils     <- MCSigils
    Tids       <- TidsCex
    Header     <- HdrCex
    MaxGen     = 1
    Nat        <- G
    NoTid      <- MCNoTid
    Contested  <- MCContested
    GenOf      <- MCGenOf
    GenOK      <- MCGenOK
    CandGenOK  <- MCCandGenOK
    ForgeBinds <- NoForgeB
    ForgeDead  <- NoForgeD
    ForgeSeals <- NoOrAllSeals
    ResolveOK  <- ResolveAny
SYMMETRY MCSymmetry
SPECIFICATION MCSpec
INVARIANTS Safety OneSealAcrossVersions HonestNoEquiv
CHECK_DEADLOCK FALSE

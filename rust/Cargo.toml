[workspace]
resolver = "2"
members = ["sigil-witness", "sigil-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
blake2b_simd = "1"
ed25519-dalek = { version = "2", features = ["batch", "rand_core"] }
rand = "0.8"
hex = "0.4"
redb = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
debug = false
lto = "thin"
codegen-units = 4
